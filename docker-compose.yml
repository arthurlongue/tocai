version: "3.8"

services:
  tocai:
    image: ghcr.io/arthurlongue/tocai:latest

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      # HTTP Redirect
      - "traefik.http.routers.tocai-http.rule=Host(`tocai.artudev.com`)"
      - "traefik.http.routers.tocai-http.entrypoints=web"
      - "traefik.http.routers.tocai-http.middlewares=tocai-redirect"
      - "traefik.http.middlewares.tocai-redirect.redirectscheme.scheme=https"

      # HTTPS Main
      - "traefik.http.routers.tocai.rule=Host(`tocai.artudev.com`)"
      - "traefik.http.routers.tocai.entrypoints=websecure"
      - "traefik.http.routers.tocai.tls=true"
      - "traefik.http.routers.tocai.tls.certresolver=le"
      - "traefik.http.services.tocai.loadbalancer.server.port=80"

    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
